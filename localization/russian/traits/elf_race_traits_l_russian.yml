# Кровные линии
 trait_royal_elf_valerith:0 "Кровная линия Дома Валерит"
 trait_royal_elf_valerith_desc:0 "Один из древних эльфийских домов, Дом Валерит известен своими культовыми серебряными волосами и неземной красотой. Тысячелетия селекции, направленной на совершенствование плоти, позволяют им обвивать других лордов вокруг своих изящных пальцев. Однако, как следствие, они сами страдают от полного отсутствия самоконтроля. Они становятся зависимыми от удовольствий и уязвимы для тех же соблазнов, которые применяют к другим."
 trait_royal_elf_valerith_character_desc:0  "Их чарующие серебряные волосы отмечают их как Валерит для всех, кто на них смотрит."

 trait_royal_elf_serelion:0 "Кровная линия Дома Серелион"
 trait_royal_elf_serelion_desc:0 "Один из древних эльфийских домов, Дом Серелион известен своими пронзительными пурпурными глазами. Серелионы славятся прагматичной жестокостью и строгим правлением. Ужас, который они внушают своим подданным, даёт им больший контроль над землями, но их напуганные войска редко бывают по-настоящему преданными и, как известно, сражаются хуже на поле боя по сравнению со своими современниками."
 trait_royal_elf_serelion_character_desc:0  "Их пронзительные пурпурные глаза отмечают их как Серелионов для всех, кто их видит."

 trait_royal_elf_gwynthorn:0 "Кровная линия Дома Гвинторн"
 trait_royal_elf_gwynthorn_desc:0 "Один из древних эльфийских домов, Дом Гвинторн известен своей трудолюбивостью и одержимой усердием. Они — неутомимые хранители своих земель, но не без цены. Их полная сосредоточенность на долге привела к тому, что многие Гвинторны загнали себя в раннюю могилу."
 trait_royal_elf_gwynthorn_character_desc:0 "Гвинторна отмечает изобилие, следующее по их следам."

 trait_royal_elf_thundarael:0 "Кровная линия Дома Тундараэль"
 trait_royal_elf_thundarael_desc:0 "Один из древних эльфийских домов, Дом Тундараэль известен своей бледной кожей, интеллектом и маниакальными личностями. Дом Тундараэль сосредоточил свою селекцию на создании могущественных повелителей Искры. Многие из самых сильных зарегистрированных маги и наделённых силой происходят из этого дома. Присущая их крови сила позволяет им двигаться с огромной скоростью и усваивать новые знания с поразительной скоростью. Однако это даётся дорогой ценой. Безумие очень распространено среди Тундараэлей, и многие из них сходят с ума от собственной силы."
 trait_royal_elf_thundarael_character_desc:0  "Кожа, бледная как луна, отмечает Тундараэля."

 trait_royal_elf_daelurin:0 "Кровная линия Дома Даэлурин"
 trait_royal_elf_daelurin_desc:0 "Один из древних эльфийских домов, Дом Даэлурин известен своими гигантскими размерами и воинским мастерством. Исторические записи о встречах с великанами, вероятно, были наблюдениями членов дома Даэлурин. Поколения селекции, направленной на бой и завоевания, породили этих грозных лордов. Хотя они могут быть великими воинами гигантских размеров, следствием этой специализации является снижение интеллекта и медлительность движений."
 trait_royal_elf_daelurin_character_desc:0  "Существо огромных размеров и силы, Даэлурин неузнаваем."

 trait_royal_elf_lormelis:0 "Кровная линия Дома Лормелис"
 trait_royal_elf_lormelis_desc:0 "Один из древних эльфийских домов, Дом Лормелис почитается за свою глубокую связь с морем и непревзойдённое мастерство как набежников. С глазами синими, как океанские глубины, они столь же пленительны, сколь и грозны. Известные своей свирепой независимостью и амбициозным духом, они неумолимы в своем стремлении вернуть славу Атлантиды. Однако эта одержимая амбициозность часто делает их негибкими и слепыми к меняющимся течениям перемен, вызывая внутренние раздоры и внешние конфликты."
 trait_royal_elf_lormelis_character_desc:0  "Их поразительные синие глаза безошибочно отмечают их как Лормелисов, потомков легендарных морских набежников Атлантиды."

 trait_track_aeluran_respect:0 "Уважение Аэлуранов"
 trait_track_aeluran_respect_desc:0 "Насколько Аэлуранские ткачи уважают эту личность."

 trait_track_elf_blood_aeluran_respect:0 "Уважение Аэлуранов"
 trait_track_elf_blood_aeluran_respect_desc:0 "Насколько Аэлуранские ткачи уважают эту личность."