l_russian:
  wolf_riders:0 "Всадники на волках"
  direwolf_riders:0 "Всадники на лютоволках"
  elk_archers:0 "Моссвудские драгуны"
  fey_archers:0 "Фейские лучники"
  elite_bow_knights:0 "Стражники-следопыты"
  aeluran_war_magi:0 "Боевые маги Аэлурана"
  aeluran_artillery:0 "Маховая артиллерия Аэлурана"

  warband_ravagers:0 "Опустошители орды"
  warband_vanguard:0 "Авангард орды"

  wolf_riders_flavor:0 "#F Их боятся во всех землях эльфов и людей. Бронированные рыцари восседают на спинах чудовищных волков.#!"
  elk_archers_flavor:0 "#F Нет кавалерии быстрее. Немногие могут спастись от их сокрушительного изматывания или неотступной погони.#!"
  fey_archers_flavor:0 "#F Наиболее распространённое призвание эльфийского воина. Их умение метко пускать стрелы — величайший страх человеческой пехоты.#!"
  elite_bow_knights_flavor:0 "#F Элитные рыцари эльфийского народа. Они убивают и луком, и мечом, а затем исчезают, прежде чем враг успевает что-либо заметить.#!"
  aeluran_war_magi_flavor:0 "#F Обученные боевые маги Ордена Аэлурана. Их разрушительные заклинания разрывают поле боя на части.#!"
  aeluran_artillery_flavor:0 "#F Маги Ордена Аэлурана, специализирующиеся на магии дальнобойной осады. Когда они приходят стучать, в безопасности не остаётся ни одна крепость, кроме самой защищённой.#!"

  warband_ravagers_flavor:0 "#F Немногие силы сражаются с такой яростью и проворством. Они терзают каждый фланг копьём, топором и дубиной!#!"
  warband_vanguard_flavor:0 "#F Воины величайшей отваги и мощи занимают своё место на острие авангарда. Их свирепость отражает всех претендентов#!"

  direwolf_riders_flavor:0 "#F Крупнее и сильнее обычных волков, эти могущественные существа наносят сокрушительный удар. Их скорость и размер делают их непревзойдённой ударной кавалерией#!"

  # warband_ravagers_flavor:0 "[GetMaA('warband_ravagers').GetName]"
  # warband_vanguard_flavor:0 "[GetMaA('warband_vanguard').GetName]"

  spark_wielders:0 "[spark_wielders|E]"
  game_concept_spark_wielder:0 "Повелитель Искры"
  game_concept_spark_wielders:0 "Повелители Искры"
  game_concept_spark_wielders_desc:0 "Повелители Искры — это [Concept('men_at_arms','профессионалы')|E], одарённые способностью использовать силу Божественной Искры, чтобы уничтожать врагов мощной магией.\n\nОни, как правило, [Concept('counter','противостоят')|E] большинство других типов отрядов, но и сами являются стеклянными пушками: их легко уничтожить без защитных сил."

  stationed_aeluran_magi:0 "Маги Аэлурана"

  stationed_aeluran_magi_1:0 "#highlight Свита магов Аэлурана#!"
  stationed_aeluran_magi_2:0 "#highlight Полная стража магов Аэлурана#!"
