l_russian:
 # Elf Blood
 game_concept_elf_blood:0 "Эльфийская кровь"
 game_concept_elf_blood_desc:0 "Результат союза эльфов и людей. Носитель эльфийской крови всё ещё является эльфом, хотя и не столь могущественным, и всё ещё может вступить на путь Восхождения."

 # Elf
 game_concept_elf:0 "Эльф"
 game_concept_elf_desc:0 "Наиболее распространённая форма эльфов во всех землях. Хотя они и превосходят людей, они находятся на низшей ступени Восхождения и эльфийского общества."

 # High Elf
 game_concept_high_elf:0 "Высший эльф"
 game_concept_high_elf_desc:0 "Эльф, сделавший первый истинный шаг Восхождения и вознёсшийся над своими собратьями как в изяществе, так и в могуществе."

 game_concept_true_elf:0 "Истинный эльф"
 game_concept_true_elf_desc:0 "Эльф, преодолевший первый великий рубеж Восхождения. Его тело и душа были в значительной мере очищены."

 game_concept_fae:0 "Фейри"
 game_concept_fae_desc:0 "Эльфы, достигшие переломной вехи Восхождения. Они настроились на более высокое созвучие с Божественной Искрой и потому могут повелевать великой магией."

 game_concept_fae_radiant:0 "Светоносный Фейри"
 game_concept_fae_radiant_desc:0 "Легендарные фейри невероятной силы. Их благородное величие делает их право править очевидным для всех."

 game_concept_celestial:0 "Небожитель"
 game_concept_celestial_desc:0 "Эльфы божественного качества. Их Восхождение даровало им способность ступать по мирам, наиболее насыщенным влиянием Божественной Искры."

 game_concept_seraphic_celestial:0 "Серафический Небожитель"
 game_concept_seraphic_celestial_desc:0 "Эльфы, достигшие почти ангельского состояния бытия."

 game_concept_eldar:0 "Эльдар"
 game_concept_eldar_desc:0 "Высший избранный народ богов и вершина обычного Восхождения."

 game_concept_maiar:0 "Майар"
 game_concept_maiar_desc:0 "Полубожественные слуги Валар и низшая ступень Айнур."

 game_concept_valar:0 "Валар"
 game_concept_valar_desc:0 "Могущественные боги Божественной Искры."

 game_concept_aratar:0 "Аратар"
 game_concept_aratar_desc:0 "Избранные, самые могущественные среди Валар."

 game_concept_unknown:0 "Неизвестно"
 game_concept_unknown_desc:0 "Вам не удалось определить расу этого персонажа."