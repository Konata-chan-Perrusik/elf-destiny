l_russian:
 elf_destiny:0 "Elf Destiny"
 elf_destiny_desc:0 "На заре цивилизации эльфы и люди пришли в этот мир через портал из другого мира. С тех пор бесчисленные империи эльфов и людей поднимались и падали, ныне утерянные во времени. Эльфы отступили на окраины мира и памяти. Вы — новый эльфийский лорд, и ваша цель — восстановить былое величие эльфов. Каким будет этот новый эльфийский народ и как он будет уживаться с людьми? \n\nОтветы на эти вопросы предстоит найти вам!"
 elf_destiny_feature_1:0 "Классные эльфийские штуки! Например, Экспедиции"

 blond_elf:0 "Эльф - Златовласый"
