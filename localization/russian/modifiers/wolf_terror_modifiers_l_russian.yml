l_russian:
  #
  wolf_terror_modifier:0 "Ужас лютоволка"
  wolf_terror_modifier_desc:0 "Лютоволк наводит ужас на это графство"

  wolf_terror_bad_modifier:0 "Великий ужас лютоволка"
  wolf_terror_bad_modifier_desc:0 "Лютоволк сеет разруху в этом графстве"

  took_pup_modifier:0 "Напуганное простонародье"
  took_pup_modifier_desc:0 "Правитель этого графства взял себе детёныша лютоволка, посеяв страх среди простого народа"

  direwolf_free_modifier:0 "Свобода от лютоволков"
  direwolf_free_modifier_desc:0 "Правитель этого графства убил детёныша лютоволка, благодаря чему народ чувствует себя в безопасности"

  direwolf_slayer_modifier:0 "Истребитель лютоволков"
  direwolf_slayer_modifier_desc:0 "Этот персонаж убил грозного лютоволка"

  direwolf_pup_pet_modifier:0 "Детёныш лютоволка-питомец"
  direwolf_pup_pet_modifier_desc:0 "У этого персонажа есть маленький детёныш лютоволка"

  grown_direwolf_pet_modifier:0 "Лютоволк-питомец"
  grown_direwolf_pet_modifier_desc:0 "У этого персонажа есть взрослый лютоволк в качестве питомца"

  fierce_direwolf_pet_modifier:0 "Свирепый лютоволк-питомец"
  fierce_direwolf_pet_modifier_desc:0 "У этого персонажа есть грозный взрослый лютоволк в качестве питомца"

  direwolf_population_modifier:0 "Присутствие лютоволков"
  direwolf_population_modifier_desc:0 "В этом графстве обитают лютоволки. Хотя они опасны для путников, ходят слухи, что они проявляют свирепую преданность местному правителю."

  weary_hunter_1:0 "Утомлённый охотник"
  weary_hunter_1_desc:0 "Дни, проведённые в погоне за неуловимой добычей, оставили вас измождённым и беспокойным. Азарт охоты меркнет под тяжестью ноющих конечностей и горечью пустых рук."

  weary_hunter_2:0 "Изнурённый охотой"
  weary_hunter_2_desc:0 "Неутомимые преследования сквозь тернии и топи истощили ваши силы и дух. Каждая безуспешная охота давит всё сильнее, а ваша решимость истончается, словно потрёпанный плащ."

  weary_hunter_3:0 "Сломленный охотой"
  weary_hunter_3_desc:0 "Охота отняла не только время — она сокрушила вашу энергию и гордость. Гончие спотыкаются, сапоги волочатся, а лес насмехается над каждым вашим шагом своим безмолвием."