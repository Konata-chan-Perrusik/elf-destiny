l_russian:
 reform_the_aeluran_faith_decision:0 "Реформировать Аэлуранскую веру"
 reform_the_aeluran_faith_desc:0 "Аэлуранские сёстры остаются неизменными уже более тысячелетия.\n\nПо обычаю Орден позволяет Повелителю земель изменить своей волей веру.\n\nС этой целью Великая матриарх выдвинула вам условия. Докажите себя, заново открыв древние эльфийские святыни, резонирующие с Божественной Искрой, — и Сёстры переделают на ваше усмотрение некоторые стороны Аэлуранской религии."
 discover_two_more_elven_holy_sites:0 "Откройте ещё #bold две#! эльфийские святыни, отправившись в экспедиции."
 reform_the_aeluran_faith_tooltip:0 "Заново откройте эльфийские святыни, чтобы получить шанс реформировать Аэлуранскую веру."
 free_religion_reformation:0 "Как Повелитель земель, вы можете один раз реформировать Аэлуранскую веру без затрат благочестия"
 reform_the_aeluran_faith_decision_confirm:0 "Новая вера для новой эпохи!"
 
 grant_aelurans_title:0 "Создать нового аэлуранского вассала"
 grant_aelurans_title_decision_desc:0 "Некоторые особенно верные эльфийские лорды питают столь глубокое почтение к Аэлуранскому ордену, что решают доверить Алым сёстрам дополнительные земли для непосредственного управления.\n\nСоздание новых аэлуранских  [Concept('vassals', 'вассалов')|E] значительно порадует Аэлуранский орден и принесёт вам заметное увеличение его уважения.\n\nНо будьте осторожны: справляться с неизбежными испытаниями власти под силу лишь эльфу с крепкой волей. Немало эльфийских лордов теряли контроль над своим краем, полагая, что смогут удержать больше аэлуранских вассалов, чем в действительности им по силам."
 grant_aelurans_title_decision_tooltip:0 "Пожертвуйте титулы Аэлуранскому ордену, чтобы создать новых аэлуранских [Concept('vassals', 'вассалов')|E]."
 grant_aelurans_title_confirm:0 "Даровать титул Аэлуранскому ордену"
 
 create_new_aeluran_order_vassal_effect:0 "Вы даруете титул Аэлуранскому ордену, после чего он выберет подходящего аэлуранского [Concept('vassal', 'вассала')|E], который будет править этими землями."
