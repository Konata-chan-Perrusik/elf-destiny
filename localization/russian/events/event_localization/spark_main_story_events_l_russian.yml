l_russian:
  # What is an archeologist?
  what_is_an_archeologist_decision:0 "Кто такой археолог?"
  what_is_an_archeologist_decision_desc:0 "Ваш управитель приближается к вам с озабоченным выражением лица.\n\n«[Select_CString(ROOT.Char.IsFemale, 'Моя госпожа', 'Мой господин' )], прибыла странная женщина, желающая аудиенции. Её зовут Юлия Мелвуд. Она утверждает, что является обученным «археологом», но я почти уверен, что этот титул выдумка». Вы оба бросаете взгляд на самопровозглашенного эксперта, который только что опрокинул вазу.\n\nВаш управитель качает головой и продолжает. «По её словам, она совершила великое открытие, связанное с «эльфами». Насколько мне известно, они не более чем детская сказка, но, видя, как она настойчива, я посчитал нужным привести её к вам. Что мне ей сказать?»"
  what_is_an_archeologist_decision_tooltip:0 "Начните своё путешествие в сердце эльфийской тайны."
  what_is_an_archeologist_decision_confirm:0 "Я хочу узнать правду об этом, впустите её!"

  # Transport the Grand Portal Decision
  transport_the_grand_portal_decision:0 "Перевезти Портал"
  transport_the_grand_portal_decision_desc:0 "Восстановление портала — достойная цель, но зачем делать это на Крайнем Севере?\n\nЕсли бы мы аккуратно перевезли части портала в столицу, то, заплатив немалые деньги, смогли бы сделать мое королевство центром силы в грядущей эпохе.\n\nЧто такое золото по сравнению с такой властью?"
  transport_the_grand_portal_decision_tooltip:0 "Перевезти остатки Великого Портала в вашу столицу"
  transport_the_grand_portal_decision_confirm:0 "Начнём немедленно"

  # Restore the Grand Portal Decision
  restore_the_grand_portal_decision:0 "Чудо нашей эпохи"
  restore_the_grand_portal_decision_desc:0 "Я [Select_CString(ROOT.Char.IsFemale, 'познала', 'познал' )] великую истину истории человечества.\n\nСобрав древние компоненты, вновь открыв утраченные знания и разыскав печать давно умершего короля, я смогу восстановить Великий Портал и вернуть нашу связь со звёздами, нашими предками и непостижимыми опасностями неизвестного мира.\n\nМне не следует принимать такое решение легкомысленно..."
  restore_the_grand_portal_decision_tooltip:0 "Восстановить связь с Высшими Сферами."
  restore_the_grand_portal_decision_confirm:0 "Я восстановлю Великий Портал!"

  restore_the_grand_portal_decision_has_portal_capacitor:0 "Я [Select_CString(ROOT.Char.IsFemale, 'приобрела', 'приобрел' )] конденсатор Портала."
  restore_the_grand_portal_decision_has_portal_navigation_relay:0 "Я [Select_CString(ROOT.Char.IsFemale, 'приобрела', 'приобрел' )] навигационное реле Портала."
  restore_the_grand_portal_decision_has_sigil_of_the_realm_lord:0 "У меня есть печать повелителя земель, и она сочла меня [Select_CString(ROOT.Char.IsFemale, 'достойной', 'достойным' )]!"

  elf_destiny_main_story_events.001.t:0 "Экспедиция в эльфийские руины"
  elf_destiny_main_story_events.001.desc:0 "Молодая женщина подходит к вам, пока ваш управитель подзывает её. «[Select_CString(ROOT.Char.IsFemale, 'Моя госпожа', 'Мой господин' )], я — Юлия Мелвуд, один из лучших археологов в своей области, если позволите мне так смело заявить». #weak Вы бросаете взгляд на своего управителя, и тот явно не впечатлён.#! Она кладёт на стол свёрнутый пергамент и разворачивает его. Вы замечаете странную письменность по краям — возможно, какой-то диалект арабского?\n«Я стремлюсь отыскать следы, оставленные нашими предками, и моя специализация — изучение загадочного эльфийского народа. Немногие найденные артефакты говорят нам, что они были высокоразвитой цивилизацией, возможно, даже более развитой, чем мы, и, похоже, просуществовали сотни, а может, и #EMP тысячи #!лет. Эта карта покрыта эльфийскими письменами, которые я не могу расшифровать, но, кажется, на ней указаны несколько возможных мест расположения крепости-гробницы Последнего Императора эльфов. Если она реальна, там могут храниться великие сокровища, забытые временем. Я бы снарядила экспедицию для исследования, но мне нужны средства на снаряжение такого путешествия. Вы поможете мне?»"
  elf_destiny_main_story_events.001.a:0 "Приключение? Вы получите мою поддержку!"
  elf_destiny_main_story_events.001.b:0 "Эльфы? Не тратьте моё время. Это же просто детская сказка!"

  elf_destiny_main_story_events.002.t:0 "Восстановить Великий Портал"
  elf_destiny_main_story_events.002.desc:0 "Реликвии прошлого собраны, а моя состоятельность не вызывает сомнений.\n\nТеперь у меня есть средства для востановления связи между мирами и утверждения себя как [Select_CString(ROOT.Char.IsFemale, 'Истинной Владычицы', 'Истинного Владыки' )] Земель.\n\nНо многие осудят меня и приложат все усилия, чтобы остановить это великое дело.\n\n[Select_CString(ROOT.Char.IsFemale, 'Готова', 'Готов' )] ли я к этому свершению?"
  elf_destiny_main_story_events.002.a:0 "Начнём же немедленно!"
  elf_destiny_main_story_events.002.c:0 "Начнём немедленно, но я останусь в своём королевстве!"
  elf_destiny_main_story_events.002.b:0 "Нужно лучше подготовиться..."
  lose_portal_components:0 "Вы потеряете конденсатор искры Великого Портала и навигационное реле"

  elf_destiny_main_story_events.0021.t:0 "Портал завершён!"
  elf_destiny_main_story_events.0021.desc:0 "После многих испытаний и огромных личных вложений. Великий Портал наконец восстановлен! Врата между этим миром и бесчисленными реальностями галактики вновь открыты.\n\nПринесёт ли это безграничное процветание или великие опасности вашему королевству? Кто и что пройдёт через врата? Новые союзники или могущественные враги?\n\nОтветы на эти и многие другие вопросы скоро будут получены!\n\n#bold Вы чувствуете, как растягиваются нити судьбы.#! Теперь вы [Select_CString(ROOT.Char.IsFemale, 'Истинная Владычица', 'Истинный Владыка' )]Земель, и пришло время оставить свой след в истории. #bold Время эльфов возвращается!#!"
  elf_destiny_main_story_events.0021.ok_move_capital:0 "Пусть портал станет центром нашего королевства!"
  elf_destiny_main_story_events.0021.ok:0 "Новая эра наступает!"

  elf_destiny_main_story_events.0023.t:0 "Спасибо за игру!"
  elf_destiny_main_story_events.0023.desc:0 "Извините, это пока весь сюжетный контент! Больше контента находится в разработке и скоро появится. Заходите на официальный Discord сервер, чтобы следить за обновлениями! \n\nЯ всё же хочу наградить вас за то, что прошли так далеко, так что выберите, что хотите! Ещё раз спасибо!"

  elf_destiny_main_story_events.0023.a:0 "Бесплатное благословение"
  elf_destiny_main_story_events.0023.b:0 "Золото и престиж"
  elf_destiny_main_story_events.0023.c:0 "Я [Select_CString(ROOT.Char.IsFemale, 'странная', 'странный' )] и ничего не хочу"

  elf_destiny_main_story_events.0022.t:0 "Перемещение Великого Портала"
  elf_destiny_main_story_events.0022.desc:0 "С величайшей осторожностью все гигантские каменные части Великого Портала погружены на массивные повозки и начинают своё паломничество в вашу столицу.\n\n Новая Эра начнётся там!"
  elf_destiny_main_story_events.0022.a:0 "Это лишь первый шаг, эльфы вновь станут великими!"
  will_replace_special_building_warning:0 "#X Предупреждение - это заменит все уже существующие особые здания в вашей столице!#!"
  elf_destiny_main_story_events.0022.b:0 "Это слишком дорого, может, нам стоит передумать..."

  remove_the_grand_portal_effect:0 "Части Великого Портала убраны, и на их месте воздвигнут священный храм в честь его наследия"

  elf_destiny_main_story_events.003.desc:0 "[scoped_ruler.GetTitledFirstName] [Select_CString(scoped_ruler.IsFemale, 'восстановила', 'восстановил')] некий древний портал на Крайнем Севере.\n\nЛегенды гласят, что это позволит [Select_CString(scoped_ruler.IsFemale, 'ему', 'ей')] общаться со звёздами и привести в этот мир народ, древний как само время.\n\nСуществующая парадигма мира может вот-вот измениться."
  elf_destiny_main_story_events.003.a:0 "Что из этого выйдет!?"

  elf_destiny_main_story_events.004.title:0 "Выбор мечты"
  elf_destiny_main_story_events.004.desc:0 "Вы погрузились в глубокий сон, как вдруг чувствуете знакомое присутствие. То же самое ощущение, что было, когда вы схватили тот амулет в эльфийской гробнице... Оно не говорит вам ничего, но проецирует в ваш разум единственную мысль.\n\n #bold «Узри.» #! \n\nИ вы видите: тысячи жизней проносятся перед вашими глазами, грозя подавить все ваши чувства. Великие войны между людьми и эльфами, обширные империи, построенные на спинах человеческих рабов, но также и великие пиры, разделённые в дружбе между королями людей и эльфов. Вы начинаете понимать намерение присутствия, когда оно передаёт другую мысль.\n\n #bold «Выбирай.»  #!"
  elf_destiny_main_story_events.004.good:0 "Люди и эльфы будут жить вместе в дружбе!"
  elf_destiny_main_story_events.004.evil:0 "Эльфы стоят выше людей! Любое иное мнение смехотворно."