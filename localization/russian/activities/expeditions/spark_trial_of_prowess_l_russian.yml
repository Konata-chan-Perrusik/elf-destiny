l_russian:
    # Trial of Prowess
    expedition.00514.title:0 "Испытание доблести"
    expedition.00514.desc:0 "Проходя по широкому коридору, вы восхищаетесь величественными статуями давно умерших эльфийских воинов, выстроившихся вдоль стен.\n\nПримерно на полпути по залу одна из статуй со скрипом оживает, её жёсткие каменные суставы скрипят друг о друга. Она движется, чтобы преградить вам путь, и с каждым шагом её движения становятся быстрее и плавнее.\n\nСтатуя стоит неподвижно, не говоря ни слова, с холодным взглядом. Её обнажённое оружие ясно указывает на вызов. \n\nКто примет этот вызов?"
    expedition.00514.playerFights:0 "Отступите, я [Select_CString(ROOT.Char.IsFemale, 'сама', 'сам')] сражусь с ним."
    expedition.00514.championFights:0 "[champion.GetFullName] — наш лучший боец, [champion.GetSheHe] справится с этим."
    expedition.00514.flee:0 "Мы не можем сражаться с таким противником, отступаем!"

    expedition.005141.title:0 "Испытание доблести"
    expedition.005141.desc.won_duel:0 "Ваш отряд побеждает! Каменная статуя в последний раз кивает в знак одобрения и рассыпается в прах, подчиняясь воле времени. Путь свободен."
    expedition.005141.desc.lost_duel:0 "Каменный страж стоит победоносно и непоколебимо. Сегодня никто не пройдет мимо него."
    expedition.005141.won_duel:0 "И это всё, что эльфы могут нам противопоставить?! Вперёд!"
    expedition.005141.lost_duel:0 "Мы должны отступить, пока его друзья тоже не начали двигаться!"

    expedition.005141.error:0 "Ошибка - что-то пошло не так..."
