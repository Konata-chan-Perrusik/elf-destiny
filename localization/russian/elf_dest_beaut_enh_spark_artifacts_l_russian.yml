l_russian:
  Nefertiti:0 "Нефертити"
  nefertitis_armband:0 "#highlight Наруч Нефертити#!"
  nefertitis_armband_desc:0 "Драгоценное украшение, принадлежавшее великой эльфийской фараонше древности, известной своей ослепительной, неповторимой красотой. Некоторые верят, что магия, заключённая в этом самом наруче, помогла ей обрести её знаменитую экзотическую внешность.\n\n#true_white #tooltip_heading Особые эффекты#!\n$EFFECT_LIST_BULLET$При экипировке получаете возможность взаимодействия #highlight Истощить красоту#! с придворными и пленниками.\n$EFFECT_LIST_BULLET$При экипировке увеличивается вероятность того, что потомство унаследует и улучшит черты красоты до [Concept('unconventional_beauty_traits','нетрадиционной красоты')|E] или [Concept('exotic_beauty_traits','экзотическая красота')|E]#!\n\n#tooltip_subheading «В присутствии моей царицы само солнце кажется бледным. Её красота не просто плоти, но души — чары столь редкие, что, должно быть, сами боги создали её божественными руками. Взглянуть на неё — значит увидеть сияние самого Атона». — Эхнатон, фараон Египта#!"
  drain_beauty:0 "Истощить красоту"
  drain_beauty_desc:0 "Поглотить красоту [recipient.GetShortUINamePossessive], чтобы насытить ею свой Наруч Нефертити"
