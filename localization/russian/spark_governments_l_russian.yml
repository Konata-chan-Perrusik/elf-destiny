  advanced_tribal_government:0 "Развитое племя"
  advanced_tribal_government_adjective:0 "Развито-племенс"
  advanced_tribal_government_with_icon: "@government_type_feudal! $advanced_tribal_government$"
  advanced_tribal_government_desc:0 "\nЭто народ земли, обладающий всеми преимуществами феодальных обитателей замков, но без их заблуждений и высокомерия.\n\nФорма правления развитого племени:\n$EFFECT_LIST_BULLET$Имеет доступ к двум дополнительным уровням всех племенных построек и может создавать новые племенные владения.\n$EFFECT_LIST_BULLET$Сохраняет способность совершать набеги на других.\n$EFFECT_LIST_BULLET$Получает некоторые преимущества, разработанные феодальными обществами, такие как власть короны, мощные законы о престолонаследии и создание побочных ветвей династии.\n$EFFECT_LIST_BULLET$Может нанимать как [GetMaA('warband_ravagers').GetName], так и [GetMaA('warband_vanguard').GetName] в качестве [Concept('men_at_arms', 'профессиональных полков')|E]."

  advanced_tribal_government_opinion:0 "Мнение [Concept('advanced_tribal_government', 'правителя с формой правления развитого племени')|E]"
  advanced_tribal_government_levy_contribution_mult: "[Concept('advanced_tribal', 'Развитого племенного')|E] [Concept('vassal', 'вассала')|E] [Concept('levy', 'ополчения')|E] [Concept('modifier_contribution', 'модификатор вклада')|E]"

  game_concept_advanced_tribal:0 "Продвинутое племенное устройство"
  game_concept_advanced_tribal_government:0 "Продвинутое племенное правление"
  game_concept_advanced_tribal_desc:0 "Продвинутые племенные государства сочетают преимущества [Concept('tribal','племенного')|E] и [Concept('feudal','феодального')|E] правления без их недостатков. В отличие от обычных племён, они не страдают от застоя в [Concept('development','развитии')|E] графств, могут осваивать [Concept('innovations','инновации')|E] эпох, следующих за племенной, строить новые [Concept('holdings','владения')|E], улучшать племенные постройки до более высоких уровней и менять [Concept('succession_law','законы престолонаследия')|E].\n\nОднако, в отличие от феодальных правителей, они могут использовать для развития своих земель и найма [Concept('men_at_arms', 'профессиональных полков')|E] [Concept('prestige','престиж')|E] вместо [Concept('gold','золота')|E], а также имеют доступ к большему числу [Concept('casus_belli', 'казус белли')|E] по сравнению с [Concept('feudal','феодальными')|E] государствами."

