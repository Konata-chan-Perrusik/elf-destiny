l_russian:
  # Universities
  building_type_deep_wood_sanctum_university:0 "Святилище Глубокого Леса"
  building_type_deep_wood_sanctum_university_desc:0 "$building_type_generic_university_desc$\n\nСвятилище Глубокого Леса — это место, где формируются сёстры Ткачей Аэлурана. Его двери открыты только для многообещающих девушек; здесь собираются самые светлые умы королевства, чтобы изучать тайные искусства."
  building_deep_wood_sanctum_university:0 "$building_type_deep_wood_sanctum_university$"
  building_deep_wood_sanctum_university_desc:0 "$building_type_deep_wood_sanctum_university_desc$"

  # Holy Sites
  building_type_holy_site_spark_grand_portal_01:0 "Древние руины Портала"
  building_type_holy_site_spark_grand_portal_01_desc:0 "Огромные каменные изваяния, разбросанные по всей округе, большей частью поглощённые природой. В центре завалов до сих пор возвышается массивный полумесяц из камня. Близлежащие фрагменты позволяют предположить, что когда-то это был целый круг.\n\nЛегенды гласят, что эти руины некогда создавали врата в другой мир."
  building_holy_site_spark_grand_portal_01:0 "$building_type_holy_site_spark_grand_portal_01$"
  building_holy_site_spark_grand_portal_01_desc:0 "$building_type_holy_site_spark_grand_portal_01_desc$"

  building_type_holy_site_spark_grand_portal_02:0 "Великий Портала"
  building_type_holy_site_spark_grand_portal_02_desc:0 "Колоссальный круг из искусно вырезанного камня возносится в небо, покоясь на столь же искусно обработанной платформе. Это заново созданные врата, соединяющие наш мир со звёздами. К порталу ведут ступени, а у их подножия теснится несколько строений, крошечных на фоне гигантского сооружения. Здесь выросло множество палаток и несколько капитальных зданий, чтобы вместить растущие толпы паломников и потенциальных путешественников.\n\nПравитель королевства может использовать этот портал, чтобы создать мост между мирами."
  building_holy_site_spark_grand_portal_02:0 "$building_type_holy_site_spark_grand_portal_02$"
  building_holy_site_spark_grand_portal_02_desc:0 "$building_type_holy_site_spark_grand_portal_02_desc$"

  woodland_grove_farms_effect_desc:0 "PlaceHolder"