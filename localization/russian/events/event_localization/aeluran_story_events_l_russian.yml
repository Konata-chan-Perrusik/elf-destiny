l_russian:
    aeluran_story.001.title:1 "Багряные гости"
    aeluran_story.001.desc:0 "Когда вы начинаете устраиваться на ночь, вы слышите лихорадочные стуки в свою дверь. Снаружи доносится какая-то большая суматоха. Пока вы устало выбираетесь из постели, пытаясь прояснить мысли, ваш слуга объясняет ситуацию: Сёстры Аэлуранского Ордена, известные простолюдинам как красные ведьмы, каким-то образом узнали о вашей последней экспедиции и требуют вашего присутствия."
    aeluran_story.001.ok:0 "Я выслушаю их в зале совета. Впустите их."

    aeluran_story.002.title:1 "Багряные гости"
    aeluran_story.002.desc:0 "Вы входите в зал совета и обнаруживаете двух аэлуранских сестёр, ожидающих вашего прибытия. Их вышитые платья и вневременная красота на мгновение лишают вас дара речи, но ваше замешательство прерывается лишь тем, что младшая из них прочищает горло.\n\n«[Select_CString(ROOT.Char.IsFemale, 'Моя госпожа', 'Мой господин')], меня зовут [aeluran_matron.GetFirstNameNoTooltip]. Вам дарована привилегия стоять перед верховным матриархом Аэлуранских Ткачей».\n\nВ этот момент другая женщина выступает вперёд и встречается с вами взглядом, двигаясь с непринужденной грацией, ее юное лицо каким-то образом излучает мудрость и проницательность.\n\n«[Select_CString(ROOT.Char.IsFemale, 'Моя госпожа', 'Мой господин')], я знаю, что наше появление неожиданно, но мы пришли обсудить дело чрезвычайной важности. Недавно я ощутила всплеск божественной энергии. То, что я нашла вас, эльфа, здесь, в человеческих землях, лишь подтверждает мои догадки. Я знаю, что вы нашли Символ Владыки Земель»."
    aeluran_story.002.ok:0 "Откуда вам это известно?"

    aeluran_story.003.title:1 "Багряные гости"
    aeluran_story.003.desc:0 "«Матриарх продолжила: «Я пришла не за тем, чтобы забрать его у вас». Её мелодичный голос завораживал. «Символ откликается только на тех, кого признает достойным. Обладание им отмечает вас как истинного #bold Эльфийского Владыку#! этого мира!\n\nВ древние времена эльфы и люди пришли в этот мир через великий портал. Бесчисленные империи возвышались и падали. В один момент сам эльфийский император, чей символ вы нашли, был свергнут в массовом восстании. Большинство эльфов были убиты или вынуждены бежать обратно через портал, оставив этот мир позади. Лишь небольшая группа укрылась в далеких диких землях, где могла жить в покое. После Великого Исхода повстанцы уничтожили ключевые компоненты портала, и наши пути в другие миры были навсегда закрыты.\n\n[Select_CString(ROOT.Char.IsFemale, 'Моя госпожа', 'Мой господин')], то, что символ избрал вас именно сейчас, — не случайность. Это подтверждение того, что Божественная Искра, великий создатель всего сущего, проявляет свою волю. Пришло время восстановить Великий Портал и вернуть эльфийский народ в этот мир!»"
    aeluran_story.003.ok:0 "Великое и достойное начинание!"

    aeluran_story.004.title:1 "Багряные гости"
    aeluran_story.004.desc:0 "«Воистину так! Вам потребуется найти замену уничтоженным компонентам портала. Я узнала, что такие вещи были редки, но всё же существовали в древние времена. Вам нужно продолжить экспедиции в древние эльфийские места и отыскать нужные компоненты». Она заканчивает, жестом предлагая младшей Сестре разложить карту на столе. «Мы принесли карты с отмеченными недавно обнаруженными эльфийскими руинами, которые вы можете исследовать». [high_matriarch.GetFirstNameNoTooltip] глубоко смотрит вам в глаза. «Судьба мира лежит в ваших руках. Я говорю это без преувеличений».\n\n«Прежде чем мы отправимся в путь обратно на Север, в наше святилище, хочу задать ещё один вопрос. Во всех мирах Эльфийские Владыки почитают Божественную Искру как истинную направляющую силу вселенной. Её волю исполняют Сёстры-Ткачи Аэлуран.  Я умоляю вас принять Орден в ваших землях. Он будет давать вам советы и продвигать интересы Божественной Искры."
    aeluran_story.004.ok:0 "Для меня честь принять аэлуранских сестер в моих владениях."
    aeluran_story.004.no:0 "Я не позволю красным ведьмам править моими владениями!"

    aeluran_story.005.title:1 "Власть Красных"
    aeluran_story.005.desc:0 "[advisor.GetName], ваш аэлуранский советник, приближается к вам.\n\n«[Select_CString(ROOT.Char.IsFemale, 'Моя госпожа', 'Мой господин')], я верно служу вашим владениям вот уже десятилетие, и хотя я сделала всё возможное, чтобы помочь вести ваш народ к свету Божественной Искры, в нынешних условиях мои возможности ограничены.\n\nЕсли бы вы предоставили моему ордену больше полномочий для лучшего воплощения воли Искры и воспитания покорности; это, без сомнения, принесло бы большее единство, процветание и весьма обрадовало бы Аэлуранский Орден»."
    aeluran_story.005.accept:0 "Я доверяю Ордену, и все эльфы должны делать так же"
    aeluran_story.005.no:0 "Хватка Ордена и так достаточно сильна"

    aeluran_story.006.title:1 "Реформирование Сестринства"
    aeluran_story.006.desc:0 "Я [Select_CString(ROOT.Char.IsFemale, 'доказала', 'доказал')] свою ценность Аэлуранскому Ордену .\n\nТеперь они просят у меня советов и изменений, чтобы лучше соответствовать новой Эре.\n\nЭльфийская мораль станет отражать мои взгляды. Слушайте внимательно, Сёстры..."
    aeluran_story.006.ok:0 "Да свершится моя воля!"

    aeluran_story.0061.title:1 "Багряные гости"
    aeluran_story.0061.desc:0 "Мудрое решение, [Select_CString(ROOT.Char.IsFemale, 'Владычица', 'Владыка')] Земель. Вместе мы откроем новую эру эльфийского процветания.\n\nОсталось обсудить еще один момент: при избрании Божественной Искрой нового Владыки Земель, по традиции Аэлуранский Орден передает ему контроль над тем, как Сестры управляют верой на его землях.\n\nСначала вам нужно доказать, что вы достойны этой чести. Исследуйте древние места нашего народа, пока не обнаружите места великого резонанса с Божественной Искрой. Найдите эти священные для нас места, и Сестринство будет считаться с вашими суждениями"
    aeluran_story.0061.ok:0 "Я разыщу утраченные cвятые места эльфов!"

    unlocked_decision_to_find_holy_sites:0 "Доступно новое решение #bold Реформировать аэлуранскую веру#!"