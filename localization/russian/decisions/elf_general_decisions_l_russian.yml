 visit_black_market_merchants_shop:0 "Посетить лавку бродячего торговца"
 visit_black_market_merchants_shop_desc:0 "Бродячий торговец дал вам свою визитку — вместе с ней и постоянное приглашение.\n\nОтправляйтесь на рынок и попробуйте отыскать его неуловимую лавку"
 visit_black_market_merchants_shop_tooltip:0 "Посетить лавку бродячего торговца"
