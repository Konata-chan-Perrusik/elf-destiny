l_russian:
  game_concept_unconventional_beauty_traits:0 "Нетрадиционная красота"
  game_concept_unconventional_beauty_traits_desc:0 "Персонажи, чья красота не соответствует традиционным или общепринятым стандартам привлекательности. Они обладают качествами или чертами, которые могут считаться нетипичными, но при этом всё равно остаются выразительными, притягательными или завораживающими по-своему."

  game_concept_exotic_beauty_traits:0 "Экзотическая красота"
  game_concept_exotic_beauty_traits_desc:0 "Персонажи, чья красота поразительно необычна или чужеземна, часто характеризуется чертами или качествами, редкими, необычными или явно отличающимися от того, что обычно наблюдается в местной или основной культуре. Она предполагает потустороннюю, манящую привлекательность, привлекающую внимание и часто вызывающую чувство тайны, очарования или благоговения."

  trait_beauty_good_unconventional:0 "Черта нетрадиционной красоты"
  trait_beauty_good_exotic:0 "Черта экзотической красоты"