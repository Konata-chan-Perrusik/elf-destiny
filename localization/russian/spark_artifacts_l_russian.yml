l_russian:
 trait_aeluran_order:0 "Аэлуранский орден"
 
 artifact_elf_history_ancient_elf_title:0 "В Древние Времена"
 artifact_elf_history_ancient_elf_desc:0 "Этот артефакт датируется долегендарными, древними временами. О его происхождении почти ничего не известно, ясно лишь, что он, по-видимому, является творением древних эльфов."
 
 direwolf_head:0 "Голова лютоволка"
 direwolf_head_desc:0 "Голова грозного и смертоносного лютоволка."

 direwolf_rug:0 "Ковёр из лютоволка"
 direwolf_rug_desc:0 "Роскошный ковёр, сделанный из шкуры гигантского белого лютоволка. Такая роскошь — предмет зависти любого короля."
 
 # Portal Components
 artifact_elf_history_portal_components_title:0 "$artifact_elf_history_ancient_elf_title$"
 artifact_elf_history_portal_components_history_desc:0 "$artifact_elf_history_ancient_elf_desc$"
 
  portal_spark_capacitor:0 "Искровой конденсатор Великого Портала"
 portal_spark_capacitor_desc:0 "Крупный неогранённый кристалл Искры. Он может накапливать огромное количество окружающей энергии, а затем использоваться для задач, требующих высокой концентрации магии, таких как перемещение через порталы."

 portal_navigation_relay:0 "Навигационный ретранслятор Великого Портала"
 portal_navigation_relay_desc:0 "Странное устройство непостижимых изгибов и углов, которое позволяет подключить портал к межгалактической сети."

 sigil_of_the_realm_lord:0 "Сигил Повелителя Земель"
 sigil_of_the_realm_lord_desc:0 "Сияющая амулетная подвеска с центральным камнем из чистой кристаллизованной энергии Искры. Она олицетворяет власть Повелителя Земель."

 portal_schematics:0 "Чертёж Портала"
 portal_schematics_desc:0 "Объёмный фолиант, заполненный нарисованными от руки изображениями различных компонентов Великого Портала. На полях — письмена на древнем эльфийском. Чудо, что эта книга сохранилась до наших дней."

 spark_crystal:0 "Кристалл Искры"
 spark_crystal_desc:0 "Небольшой неогранённый кристалл Искры. Образован из чистой энергии Искры, сконцентрированной глубоко под землёй. Они высоко ценятся магами, которые используют их для увеличения силы своих заклинаний и ритуалов."

 lembas_satchel:0 "#highlight Пояс пекаря с лембасом#!"
 lembas_satchel_desc:0 "Дорожная сумка, полная рационов волшебного эльфийского хлеба лембас. Одного укуса достаточно, чтобы насытить взрослого человека.\n\n#highlight Если экипирован, экспедиции, проводимые этим персонажем, обеспечены припасами как минимум на дополнительные#! #true_white две#! #highlight недели#!"

 vanas_foeglass:0 "#highlight Фоглас Ваны#!"
 vanas_foeglass_desc:0 "Подаренный видному предку в давно минувшую эпоху самой богиней Ваной, он является драгоценной реликвией семьи Валэрит. Помимо собственного отражения, при должной концентрации Фоглас может показывать тени. Призраки тех, в чьих сердцах зритель числится врагом. Чем ближе угроза и чем сильнее ненависть, тем чётче они будут видны.\n\n#tooltip_subheading «Видишь их там, крадущихся? Настоящие проблемы начнутся, только когда я увижу белки их глаз.»#!"

 nefertitis_armband:0 "#highlight Наруч Нефертити#!"
 nefertitis_armband_desc:0 "Драгоценное украшение великой эльфийской фараона древности, известной своей ослепительной, неповторимой красотой. Некоторые верят, что магия, заключённая в этом самом наруче, помогла ей обрести её экзотическую внешность.\n\n#tooltip_subheading «Любовь моя уникальна, и никто не может сравниться с ней. Просто пройдя мимо, она уже украла моё сердце.» Найдено на стенах погребальной камеры царицы Нефертари#!\n\n#highlight #credits_header Особые эффекты#!\n$EFFECT_LIST_BULLET$При экипировке получаете возможность взаимодействия #true_white Истощить красоту#! с придворными и пленниками.\n$EFFECT_LIST_BULLET$При экипировке увеличивается шанс улучшения черт красоты у потомства до [GetTraitGroup('beauty_good_exotic').GetName]#!"
 
 artifact_elf_sword_name:0 "Клинок $artifact_name_prefix$ [SCOPE.Custom('ElfArtifactArchetypeTitle')]"
 artifact_elf_sword_description:3 "[SCOPE.Custom('ArtifactQuality')] [newly_created_elf_artifact.GetFeatureText( 'blade_metal' )] меч превосходного эльфийского мастерства. [SCOPE.Custom('ElfArtifactArchetypeDescription')]"
 
 artifact_elf_dagger_name:0 "Кинжал $artifact_name_prefix$ [SCOPE.Custom('ElfArtifactArchetypeTitle')]"
 artifact_elf_dagger_description:1 "[SCOPE.Custom('ArtifactQuality')] [newly_created_elf_artifact.GetFeatureText( 'blade_metal' )] кинжал превосходного эльфийского мастерства. [SCOPE.Custom('ElfArtifactArchetypeDescription')]"

 artifact_elf_axe_name:0 "Топор $artifact_name_prefix$ [SCOPE.Custom('ElfArtifactArchetypeTitle')]"
 artifact_elf_axe_description:2 "[SCOPE.Custom('ArtifactQuality')] боевой топор превосходного эльфийского мастерства. [SCOPE.Custom('ElfArtifactArchetypeDescription')]"

 artifact_elf_hammer_name:0 "Молот $artifact_name_prefix$ [SCOPE.Custom('ElfArtifactArchetypeTitle')]"
 artifact_elf_hammer_description:3 "[SCOPE.Custom('ArtifactQuality')] боевой молот превосходного эльфийского мастерства. [SCOPE.Custom('ElfArtifactArchetypeDescription')]"
 
 artifact_elf_spear_name:0 "Эльфийское копьё $artifact_name_prefix$"
 artifact_elf_spear_description:2 "[SCOPE.Custom('ArtifactQuality')] длинное копьё искусной работы. [newly_created_elf_artifact.Custom('ArtifactSpearHeadDescription')] [newly_created_elf_artifact.Custom('ArtifactSpearShaftDescription')]"

 artifact_elf_mace_name:0 "Эльфийская булава $artifact_name_prefix$"
 artifact_elf_mace_description:2 "[SCOPE.Custom('ArtifactQuality')] фланцевая булава искусной работы. [newly_created_elf_artifact.Custom('ArtifactMaceHeadDescription')] [newly_created_elf_artifact.Custom('ArtifactMaceHandleDescription')]"

 artifact_elf_bow_name:0 "Эльфийский лук $artifact_name_prefix$"
 artifact_elf_bow_description:3 "[SCOPE.Custom('ArtifactQuality')] [newly_created_elf_artifact.GetFeatureText( 'blade_metal' )] лук превосходного эльфийского мастерства. [newly_created_elf_artifact.Custom('ArtifactBowDecoration')]"

 artifact_elf_long_bow_name:0 "Эльфийский длинный лук $artifact_name_prefix$"
 artifact_elf_long_bow_description:3 "[SCOPE.Custom('ArtifactQuality')] [newly_created_elf_artifact.GetFeatureText( 'blade_metal' )] длинный лук превосходного эльфийского мастерства. [newly_created_elf_artifact.Custom('ArtifactLongBowDecoration')]"

 artifact_elf_composite_bow_name:0 "Эльфийский композитный лук $artifact_name_prefix$"
 artifact_elf_composite_bow_description:3 "[SCOPE.Custom('ArtifactQuality')] [newly_created_elf_artifact.GetFeatureText( 'blade_metal' )] композитный лук превосходного эльфийского мастерства. [newly_created_elf_artifact.Custom('ArtifactCompositeBowDecoration')]"

 artifact_elf_crossbow_bow_name:0 "Эльфийский арбалет $artifact_name_prefix$"
 artifact_elf_crossbow_bow_description:3 "[SCOPE.Custom('ArtifactQuality')] [newly_created_elf_artifact.GetFeatureText( 'blade_metal' )] арбалет превосходного эльфийского мастерства. [newly_created_elf_artifact.Custom('ArtifactCrossbowBowDecoration')]"

 artifact_elf_armor_name:0 "Эльфийские доспехи $artifact_name_prefix$ [SCOPE.Custom('ElfArtifactArchetypeTitle')]"
 artifact_elf_armor_description:0 "[SCOPE.Custom('ArtifactArmorDesc')]. [newly_created_elf_artifact.GetFeatureText('armor_helmet')]. [newly_created_elf_artifact.GetFeatureText('armor_decoration')]. [SCOPE.Custom('ElfArtifactArchetypeDescription')]"

 artifact_elf_armor_mail_name:0 "Кольчужные доспехи $artifact_name_prefix$ [SCOPE.Custom('ElfArtifactArchetypeTitle')]"
 artifact_elf_armor_mail_description:2 "Искусная эльфийская работа отличает эти доспехи от простой кольчуги. [SCOPE.Custom('ElfArtifactArchetypeDescription')]"

 artifact_elf_armor_plate_name:0 "Латные доспехи $artifact_name_prefix$ [SCOPE.Custom('ElfArtifactArchetypeTitle')]"
 artifact_elf_armor_plate_description:2 "Доспехи состоят из крупных пластин [newly_created_elf_artifact.GetFeatureText( 'armor_material' )], искусно выкованных эльфами, чтобы полностью покрывать носителя. [SCOPE.Custom('ElfArtifactArchetypeDescription')]"

 artifact_elf_armor_scale_name:0 "Чешуйчатые доспехи $artifact_name_prefix$ [SCOPE.Custom('ElfArtifactArchetypeTitle')]"
 artifact_elf_armor_scale_description:2 "Доспехи искусно изготовлены эльфами из [newly_created_elf_artifact.GetFeatureText( 'armor_material' )] чешуек, [SCOPE.Custom('ArtifactAdverbQuality')] прикреплённых к кожаной основе. [SCOPE.Custom('ElfArtifactArchetypeDescription')]"

 artifact_elf_armor_lamellar_name:0 "Ламеллярные доспехи $artifact_name_prefix$ [SCOPE.Custom('ElfArtifactArchetypeTitle')]"
 artifact_elf_armor_lamellar_description:2 "Эти доспехи были созданы искусными эльфами из пластин [newly_created_elf_artifact.GetFeatureText( 'armor_material' )], [SCOPE.Custom('ArtifactAdverbQuality')] соединённых шнурами из [newly_created_elf_artifact.GetFeatureText( 'generic_material_cordage' )], в то время как отделка и подкладка вырезаны из тонкой [newly_created_elf_artifact.GetFeatureText( 'generic_material_cloth' )]. [SCOPE.Custom('ElfArtifactArchetypeDescription')]"

 artifact_elf_armor_laminar_name:0 "Ламинарные доспехи $artifact_name_prefix$ [SCOPE.Custom('ElfArtifactArchetypeTitle')]"
 artifact_elf_armor_laminar_description:2 "Эти доспехи созданы искусными эльфами из горизонтально перекрывающихся полос [newly_created_elf_artifact.GetFeatureText( 'armor_material' )], [SCOPE.Custom('ArtifactAdverbQuality')] связанных шнурами из [newly_created_elf_artifact.GetFeatureText( 'generic_material_cordage' )], в то время как отделка и подкладка вырезаны из тонкой [newly_created_elf_artifact.GetFeatureText( 'generic_material_cloth' )]. [SCOPE.Custom('ElfArtifactArchetypeDescription')]"

 artifact_elf_armor_brigandine_name:0 "Бригантина $artifact_name_prefix$ [SCOPE.Custom('ElfArtifactArchetypeTitle')]"
 artifact_elf_armor_brigandine_description:2 "[newly_created_elf_artifact.GetFeatureText( 'armor_material' )] этих доспехов была [SCOPE.Custom('ArtifactAdverbQuality')] усилена изнутри эльфийскими мастерами продолговатыми стальными пластинами и покрыта слоем [newly_created_elf_artifact.GetFeatureText( 'generic_material_cloth' )]. [SCOPE.Custom('ElfArtifactArchetypeDescription')]"
 artifact_elf_armor_fallback_description:2 "[SCOPE.Custom('ArtifactDecorationArmor')]. [SCOPE.Custom('ElfArtifactArchetypeDescription')]"

 artifact_elf_regalia_name:0 "Эльфийские регалии $artifact_name_prefix$"
 artifact_elf_regalia_description:1 "[SCOPE.Custom('ArtifactArticleWealth')] комплект регалий [SCOPE.Custom('ArtifactQuality')] работы. Он состоит из [newly_created_elf_artifact.GetFeatureText( 'regalia_scepter' )], [newly_created_elf_artifact.GetFeatureText( 'regalia_clothes' )] и [newly_created_elf_artifact.GetFeatureText( 'regalia_accessory' )]."

 artifact_elf_crown_name:0 "Эльфийская корона $artifact_name_prefix$"
 artifact_elf_crown_description:1 "[SCOPE.Custom('ArtifactArticleWealth')] корона [SCOPE.Custom('ArtifactQuality')] работы. Корона выкована из [newly_created_elf_artifact.GetFeatureText( 'decoration_material_wire' )] и [newly_created_elf_artifact.GetFeatureText( 'crown_decoration' )]."

 artifact_elf_brooch_name:0 "Фибула $artifact_name_prefix$ [SCOPE.Custom('ElfArtifactArchetypeTitle')]"
 artifact_elf_brooch_description:1 "[SCOPE.Custom('ArtifactArticleWealth')] фибула [SCOPE.Custom('ArtifactQuality')] эльфийской работы. [SCOPE.Custom('ElfArtifactArchetypeDescription')]"

 artifact_elf_ring_name:0 "Эльфийское кольцо $artifact_name_prefix$"
 artifact_elf_ring_description:1 "[SCOPE.Custom('ArtifactArticleWealth')] кольцо [SCOPE.Custom('ArtifactQuality')] работы. [newly_created_elf_artifact.GetFeatureText( 'ring_decoration' )]."

 artifact_elf_necklace_name:0 "Эльфийское ожерелье $artifact_name_prefix$"
 artifact_elf_necklace_description:1 "[SCOPE.Custom('ArtifactArticleWealth')] ожерелье [SCOPE.Custom('ArtifactQuality')] работы [newly_created_elf_artifact.GetFeatureText( 'necklace_decoration' )]."

 artifact_elf_boots_name:0 "Сапоги $artifact_name_prefix$ [SCOPE.Custom('ElfArtifactArchetypeTitle')]"
 artifact_elf_boots_description:1 "[SCOPE.Custom('ArtifactArticleWealth')] пара сапог [SCOPE.Custom('ArtifactQuality')] эльфийской работы. [SCOPE.Custom('ElfArtifactArchetypeDescription')]"

 ## Архетипы
 archetype_ravager_title:0 "Разорителя"
 archetype_roadmen_title:0 "Проводников"
 archetype_paladin_title:0 "Паладина"
 archetype_captain_title:0 "Капитана"
 archetype_noble_title:0 "Вельможи"
 archetype_aeluran_title:0 "Аэлуранской сестры"
 archetype_not_found_title:0 "Эльфийского простолюдина"

 archetype_ravager_description:0 "Этот артефакт когда-то принадлежал могущественному эльфийскому набежнику; пусть и вы разоряете земли, как это делал он."
 archetype_roadmen_description:0 "Этот артефакт когда-то принадлежал ловкому эльфийскому следопыту; пусть и вы исследуете земли, как это делал он."
 archetype_paladin_description:0 "Этот артефакт когда-то принадлежал стойкому эльфийскому рыцарю; пусть и вы защищаете земли, как это делал он."
 archetype_captain_description:0 "Этот артефакт когда-то принадлежал мудрому эльфийскому офицеру; пусть и вы завоёвываете земли, как это делал он."
 archetype_noble_description:0 "Этот артефакт когда-то принадлежал благородному эльфийскому аристократу; пусть и вы управляете землями, как это делал он."
 archetype_aeluran_description:0 "Этот артефакт когда-то принадлежал могущественной Аэлуранской сестре; пусть и вы наводите порядок на землях, как это делала она."
 archetype_not_found_desc:0 "Это ошибка. Пожалуйста, сообщите разработчикам мода «Elf Destiny Mod»"