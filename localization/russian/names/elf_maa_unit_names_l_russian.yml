  aeluran_reinforcement_level_2_tooltip:0 "Вы можете содержать более крупный отряд [Concept('aeluran_magi_regiments','боевых магов Аэлурана')|E]"
  aeluran_reinforcement_level_3_tooltip:0 "Вы можете содержать гораздо более крупный отряд [Concept('aeluran_magi_regiments','боевых магов Аэлурана')|E]"

