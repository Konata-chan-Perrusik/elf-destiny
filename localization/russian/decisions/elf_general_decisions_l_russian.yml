l_russian:    
 adopt_elven_elective:0 "Принять эльфийские выборы"
 adopt_elven_elective_decision_desc:0 "#EMP Пути людей порочны и противоестественны. Правителя следует выбирать из лучших среди нас.#!\n\n#tooltip_heading @elf_icon! Эльфийские выборы#!\n$EFFECT_LIST_BULLET$Кандидаты выбираются из семьи держателя титула и его [de_jure|E] [Concept('direct_vassals', 'прямых вассалов')|E] этого титула.\n$EFFECT_LIST_BULLET$[electors|E] — это [de_jure|E] эльфийские [Concept('holders', 'владетели')|E] данного титула.\n\n#BOL Эльфы превыше всего ценят кровь и достоинство.#!\n$EFFECT_LIST_BULLET$Помимо личных предпочтений, эльфийские [electors|E] будут голосовать за кандидатов по признакам их достоинства, включая их эльфийский ранг, родословные и общую генетическую состоятельность."
 adopt_elven_elective_decision_tooltip:0 "Ваш [primary_title|E] принимает [succession_law|E] [GetLaw('elf_elective_succession_law').GetName]"
 adopt_elven_elective_confirm:0 "Принять [succession_law|E] [GetLaw('elf_elective_succession_law').GetName]"

 adopt_elven_elective_effect:0 "Принять [succession_law|E] [GetLaw('elf_elective_succession_law').GetName]"

 adopt_ascended_tribal:0 "Принять развитое племенное правление"
 adopt_ascended_tribal_decision_desc:0 "#EMP Верить, что отказ от сокровенной мудрости природы ради безумия и разложения городской жизни — это прогресс, — извращённая догма глупцов.\nОни пытаются присвоить себе мантию цивилизации, но истинная цивилизация — в объятиях леса. Если уж мы будем строить великие города и крепости — пусть они будут там!#!\n\n[government|E] [GetGovernment('advanced_tribal_government').GetName] имеет многие сильные стороны и некоторые слабости. [Concept( 'feudal', 'феодальные' )|E] и [Concept( 'tribal', 'племенные' )|E] [governments|E]:\n$EFFECT_LIST_BULLET$Все графства будут требовать племя как основной тип [Concept( 'holding', 'владения' )|E], но смогут строить и содержать дополнительные [Concept( 'feudal', 'феодальные' )|E] [Concept( 'holding', 'владения' )|E].\n$EFFECT_LIST_BULLET$Открывает ещё два уровня построек для племенных [Concept( 'holding', 'владений' )|E].\n$EFFECT_LIST_BULLET$Правители с развитым племенным правлением могут нанимать [GetMaA('warband_ravagers').GetName], и [GetMaA('warband_vanguard').GetName] в качестве [Concept('men_at_arms', 'профессионалов')|E]"
 
 adopt_ascended_tribal_decision_tooltip:0 "Изменить [government|E] у вас и ваших [Concept('vassals', 'вассалов')|E] на [GetGovernment('advanced_tribal_government').GetName]"

 adopt_ascended_tribal_decision_convert_holdings_tooltip:0 "Каждое [county|E] в вашей [Concept('realm', 'державе')|E] получит либо случайную пустое [Concept( 'barony', 'баронство' )|E], либо — если свободных нет — своё столичное [Concept( 'barony', 'баронство' )|E], преобразованное в [Concept( 'tribal', 'племенное' )|E] [holding|E]."


    
 adopt_ascended_tribal_confirm:0 "Хватай моё копьё!"

 tame_direwolf_pup:0 "Приручить щенка лютоволка"
 tame_direwolf_pup_decision_desc:0 "Я ищу благородного спутника, и лютоволк рядом со мной был бы как нельзя кстати для [ROOT.Char.GetLadyLord] моего положения.\n\nВ моих землях действует стая лютоволков — я могу попытаться взять щенка себе!"
 tame_direwolf_pup_effect_desc:0 "Вы попытаетесь забрать щенка лютоволка.\n\nНаличие черт [GetTrait('physique_good_1').GetName(GetNullCharacter)], [GetTrait('physique_good_2').GetName(GetNullCharacter)], [GetTrait('physique_good_3').GetName(GetNullCharacter)] и [GetTrait('physique_good_4').GetName(GetNullCharacter)]\nпомогут вам добиться успеха\n\nНаличие черты [GetTrait('warg').GetName(GetNullCharacter)] #P значительно#! повысит ваши шансы на успех\n\n#warning Предупреждение: вы можете погибнуть#!"
 tame_direwolf_pup_decision_tooltip:0 "Попытаться найти и приручить лютоволка"
 already_have_pet:0 "У вас уже есть питомец"
 ALREADY_HAS_PET:0 "У вас уже есть питомец"
