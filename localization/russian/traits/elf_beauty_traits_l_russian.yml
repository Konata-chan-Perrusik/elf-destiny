l_russian:
  trait_unconventional_beauty_good_1:0 "Нетрадиционно приятный внешне"
  trait_unconventional_beauty_good_1_desc:0 "У этого персонажа необычные выразительные черты, которые делают его приятным для взгляда."
  trait_unconventional_beauty_good_1_character_desc:0 "У [ROOT.GetCharacter.GetFirstNameNoTooltip] необычные выразительные черты, которые делают [ROOT.GetCharacter.GetHerHim] приятным для взгляда."

  trait_unconventional_beauty_good_2:0 "Нетрадиционно привлекательный"
  trait_unconventional_beauty_good_male_2:0 "Нетрадиционно красивый"
  trait_unconventional_beauty_good_female_2:0 "Нетрадиционно прекрасная"
  trait_unconventional_beauty_good_2_desc:0 "Этот персонаж благословлён необычными выразительными чертами, дарящими ему приятное телосложение."
  trait_unconventional_beauty_good_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] благословлён необычными выразительными чертами, дарящими [ROOT.GetCharacter.GetHerHim] приятное [ROOT.Char.Custom('FemaleMale')] телосложение."

  trait_unconventional_beauty_good_3:0 "Нетрадиционно красивый"
  trait_unconventional_beauty_good_3_desc:0 "Захватывающий, завораживающий и прелестный; этот персонаж со своими необычными выразительными чертами затмевает большинство своей красотой."
  trait_unconventional_beauty_good_3_character_desc:0 "Захватывающий, завораживающий и прелестный; [ROOT.GetCharacter.GetFirstNameNoTooltip] со своими необычными выразительными чертами затмевает большинство своей красотой."


  trait_exotic_beauty_good_1:0 "Экзотично приятный внешне"
  trait_exotic_beauty_good_1_desc:0 "У этого персонажа экзотичные черты, поистине уникальные для этого мира, которые делают его приятным для взгляда."
  trait_exotic_beauty_good_1_character_desc:0 "У [ROOT.GetCharacter.GetFirstNameNoTooltip] экзотичные черты, поистине уникальные для этого мира, которые делают [ROOT.GetCharacter.GetHerHim] приятным для взгляда."

  trait_exotic_beauty_good_2:0 "Экзотично привлекательный"
  trait_exotic_beauty_good_male_2:0 "Экзотично красивый"
  trait_exotic_beauty_good_female_2:0 "Экзотично прекрасная"
  trait_exotic_beauty_good_2_desc:0 "Этот персонаж благословлён экзотичными чертами, поистине уникальными для этого мира, дарящими ему приятное телосложение."
  trait_exotic_beauty_good_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] благословлён экзотичными чертами, поистине уникальными для этого мира, дарящими [ROOT.GetCharacter.GetHerHim] приятное [ROOT.Char.Custom('FemaleMale')] телосложение."

  trait_exotic_beauty_good_3:0 "Экзотично красивый"
  trait_exotic_beauty_good_3_desc:0 "Захватывающий, завораживающий и прелестный; этот персонаж со своими экзотичными чертами, поистине уникальными для этого мира, затмевает большинство своей красотой."
  trait_exotic_beauty_good_3_character_desc:0 "Захватывающий, завораживающий и прелестный; [ROOT.GetCharacter.GetFirstNameNoTooltip] со своими экзотичными чертами, поистине уникальными для этого мира, затмевает большинство своей красотой."

  trait_beauty_good_male_4:0 "Адонический"
  trait_beauty_good_female_4:0 "Афродический"
  trait_beauty_good_4_desc:0 "Их гипнотическая грация излучает божественную ауру, требующую внимания от всех, кто на них смотрит. Божественная Искра одарила их ангельским обликом, который мог бы вызвать зависть у богов."
  trait_beauty_good_4_character_desc:0 "Гипнотическая грация [ROOT.GetCharacter.GetFirstNameNoTooltip] излучает божественную ауру, требующую внимания от всех, кто смотрит на [ROOT.GetCharacter.GetHerHim]. Божественная Искра одарила [ROOT.GetCharacter.GetHerHim] ангельским обликом, который мог бы вызвать зависть у богов."