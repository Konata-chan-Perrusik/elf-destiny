  elf_elective_succession_law:0 "Эльфийские выборы"
  elf_elective_electors:0 "Де-юре вассалы-эльфы"
  elf_elective_electors_tooltip:0 "Чтобы быть действительным [Concept('elector','выборщиком')|E] при Эльфийских выборах, вассал должен соответствовать всем следующим условиям:\n$EFFECT_LIST_BULLET$Быть эльфом\n$EFFECT_LIST_BULLET$Быть [Concept('de_jure','де-юре')|E] вассалом титула"
  elf_elective_candidates:0 "Семья эльфийского правителя и прямые де-юре вассалы"
  elf_elective_candidates_tooltip:0 "Чтобы быть действительным кандидатом при Эльфийских выборах, персонаж должен быть эльфом и соответствовать одному из следующих условий:\n$EFFECT_LIST_BULLET$Быть законным [Concept('close_family','близких родственников')|E] текущего правителя, чей [Concept('primary_title','первый титул')|E] имеет более низкий или равный [Concept('title_tier','ранг')|E], чем избираемый титул.\n$EFFECT_LIST_BULLET$Быть законным [Concept( 'extended_family', 'дальним родственником' )|E] текущего правителя, который является [Concept('unlanded','безземельным')|E] и не наследует теократию или республику.\n$EFFECT_LIST_BULLET$Быть [Concept('claimant','претендентом')|E] на титул, который не наследует теократию или республику\n$EFFECT_LIST_BULLET$Быть прямым де-юре вассалом титула"

