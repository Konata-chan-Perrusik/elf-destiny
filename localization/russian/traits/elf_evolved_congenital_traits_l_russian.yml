l_russian:
  #Titan/Valkyrian
  trait_physique_good_4:0 "Титан"
  trait_physique_good_male_4:0 "Титан"
  trait_physique_good_female_4:0 "Валькирия"
  trait_physique_good_4_desc:0 "Кости и мышцы выкованы как железо, но движимы осторожной грацией ловкого танцора; Божественная Искра вмешалась, чтобы даровать им уровень физического совершенства, когда-то считавшийся достижимым лишь в мифах."
  trait_physique_good_4_character_desc:1 "Кости и мышцы выкованы как железо, но движимы осторожной грацией ловкого танцора; Божественная Искра вмешалась, чтобы даровать [Root.GetCharacter.GetFirstNameNoTooltip] уровень физического совершенства, когда-то считавшийся достижимым лишь в мифах."

  # Erudite
  trait_intellect_good_4:0 "Эрудит"
  trait_intellect_good_4_desc:0 "Сложнейшие расчёты — тривиальны, а изощрённые стратегические планы — лишь мимолётная мысль. Божественная Искра наполняет разум постоянным вдохновением, даря уровень проницательности, способный соперничать с величайшими учёными в истории."
  trait_intellect_good_4_character_desc:0 "Сложнейшие расчёты — тривиальны, а изощрённые стратегические планы — лишь мимолётная мысль. Божественная Искра наполняет разум постоянным вдохновением, даря [ROOT.GetCharacter.GetFirstNameNoTooltip] уровень проницательности, способный соперничать с величайшими учёными в истории."

  # Adonis => Aphroditic
  trait_beauty_good_male_4:0 "Адонический"
  trait_beauty_good_female_4:0 "Афродический"
  trait_beauty_good_4_desc:0 "Их гипнотическая грация излучает божественную ауру, требующую внимания от всех, кто на них смотрит. Божественная Искра одарила их ангельским обликом, который мог бы вызвать зависть у богов."
  trait_beauty_good_4_character_desc:0 "Гипнотическая грация [ROOT.GetCharacter.GetFirstNameNoTooltip] излучает божественную ауру, требующую внимания от всех, кто смотрит на [ROOT.GetCharacter.GetHerHim]. Божественная Искра одарила [ROOT.GetCharacter.GetHerHim] ангельским обликом, который мог бы вызвать зависть у богов."

  # Shrewd lvl 2
  trait_shrewd_2:0 "Мудрый"
  trait_shrewd_2_desc:0 "Глубокую мудрость и понимание мира и его обитателей обрёл [ROOT.GetCharacter.GetFirstNameNoTooltip], не в последнюю очередь благодаря обширным дебатам и дискуссиям, проходящим в Агорах."
  trait_shrewd_2_character_desc:0 "Глубокую мудрость и понимание мира и его обитателей даровала [ROOT.GetCharacter.GetHerHim] Божественная Искра."

  # Purer Blood
  trait_purer_blooded:0 "Чистокровный"
  trait_purer_blooded_desc:0 "У этого персонажа очень чистая кровная линия. Немногие могут похвастаться таким наследием."
  trait_purer_blooded_character_desc:0 "У [ROOT.GetCharacter.GetFirstNameNoTooltip] чистая кровная линия. Немногие могут похвастаться таким наследием."

  # Purest Blood
  trait_purest_blooded:0 "Наичистейшей крови"
  trait_purest_blooded_desc:0 "Чистота кровной линии этого персонажа не имеет себе равных. Некоторые говорят, что в его жилах течёт кровь самих богов."
  trait_purest_blooded_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] обладает непревзойдённой чистотой крови. Некоторые говорят, что в его жилах течёт кровь самих богов."

  trait_adventurer_1:0 "Рьяный искатель приключений"
  trait_adventurer_1_desc:0 "Этот персонаж прожил жизнь, полную храбрости и действий, как страстный искатель приключений."
  trait_adventurer_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] прожил жизнь, полную храбрости и действий, как страстный искатель приключений."
  trait_adventurer_2:0 "Знаменитый искатель приключений"
  trait_adventurer_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] бесстрашен до безрассудства и прожил жизнь, полную храбрости и действий, как страстный искатель приключений."
  trait_adventurer_3:0 "Легендарный искатель приключений"
  trait_adventurer_3_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] известен по всему миру [ROOT.GetCharacter.GetHerHis] бесстрашными деяниями и [ROOT.GetCharacter.GetHerHis] героическими свершениями."

  trait_track_adventurer:0 "Искатель приключений"
  trait_track_adventurer_desc:0 "Открывать мир с огненной страстью и жаждой жизни — вот призвание Искателя приключений."

  trait_magic_talent:0 "Дар к Искре"

  trait_magic_talent_1:0 "Одарённый Искрой"
  trait_magic_talent_1_desc:0 "Этот персонаж родился с базовой способностью управлять Искрой."

  trait_magic_talent_2:0 "Виртуоз Искры"
  trait_magic_talent_2_desc:0 "Этот персонаж родился с необычайно сильной способностью управлять Искрой."

  trait_magic_talent_3:0 "Вундеркинд Искры"
  trait_magic_talent_3_desc:0 "Этот персонаж родился бушующей бурей Искры."

  spark_talent_increased:0 "Дар к Искре усилился!"

  trait_endless_lord:0 "Бесконечный Лорд"
  trait_endless_lord_desc:0 "Этот персонаж является идеальной генетической копией своего родителя-лорда."

  trait_track_endless_lord:0 "Поколения"
  trait_track_endless_lord_desc:0 "Сколько поколений подряд эта божественная форма повторялась."

