 ascension_ritual_decision_desc:0 "Вы достигли вершины своего текущего эльфийского ранга и готовы вознестись!\n\nУдалитесь в свои покои и начните медитации. Если Божественная Искра окажется благосклонна, вы выйдете оттуда существом более высокого порядка."
 ascension_ritual_threshold_1_decision_desc:0 "Созерцайте своё великолепие! Вы достигли великого рубежа! Вы обрели абсолютную вершину ранга Обычного эльфа и готовы вознестись, чтобы стать чем-то #italic большим#!.\n\nЗавершив это вознесение, вы вступите в ряды царственных Фей — эльфов, что возвышаются над простым людом, и их право править очевидно для всех."
 ascension_ritual_threshold_2_decision_desc:0 "Созерцайте своё великолепие! Вы достигли великого рубежа! Вы обрели абсолютную вершину ранга Фей и готовы вознестись, чтобы стать чем-то #italic большим#!.\n\nЗавершив это вознесение, вы вступите в ряды мистических Целестиалов — ангелоподобных эльфов с великой силой и подлинным бессмертием."
 ascension_ritual_threshold_3_decision_desc:0 "Созерцайте своё великолепие! Вы достигли великого рубежа! Вы обрели абсолютную вершину ранга Целестиалов и готовы вознестись, чтобы стать чем-то #italic большим#!.\n\nЗавершив это вознесение, вы вступите в ряды божественных Айнур — богов эльфов и высших служителей Божественной Искры."

 ascension_ritual_decision_confirm:0 "Я готов[Select_CString(ROOT.Char.IsFemale, 'а', '' )]."
 ascension_ritual_decision_first_threshold_confirm:0 "[Select_CString(ROOT.Char.IsFemale, 'Я стану великой владычицей Фэй!', 'Я стану великим владыкой Фэй!' )]"
 ascension_ritual_decision_second_threshold_confirm:0 "Я буду среди Целестиалов!"
 ascension_ritual_decision_final_threshold_confirm:0 "[Select_CString(ROOT.Char.IsFemale, 'Я стану богиней, что ходит среди смертных!', 'Я стану богом, что ходит среди смертных!' )]"

 need_to_restore_portal:0 "В этом мире осталось слишком мало окружающей Искры, чтобы вознестись к следующему эльфийскому рангу. Сначала необходимо восстановить Великий портал."
 players_cant_be_gods:0 "Способ вознесения к рядам Айнур известен лишь немногим. Говорят, сперва нужно быть избранным самой Божественной Искрой!\n\n#D Также ходят слухи от разработчиков, что сейчас в игре вообще нет способа достичь этого ранга. Следите за будущими патчами!#!"

 blessing_ritual_decision:0 "Ритуал благословения Божественной Искры"
 blessing_ritual_decision_desc:0 "Вы накопили достаточно благосклонности Божественной Искры, чтобы просить у неё благословения!\n\nУдалитесь в свои покои и начните медитацию."
 blessing_ritual_decision_confirm:0 "Благослови меня!"
 blessings_options_are_available:0 "Ваша культура не должна иметь все возможные Благословения."

 ascension_ritual_decision_tooltip:0 "Вступить в общение с Божественной Искрой и вознестись к более высокому уровню эльфийской сущности."
 blessing_ritual_decision_tooltip:0 "Вступить в общение с Божественной Искрой и даровать своему народу один из её даров."
 
 attempt_to_break_entrancement:0 "Попытаться разорвать очарование"
 attempt_to_break_entrancement_desc:0 "Мой разум мне не принадлежит — я слишком долго был под чужим контролем. Я должен бороться, я должен вернуть себе свободу!\n\nПока во мне ещё есть воля попытаться..."

 attempt_to_break_entrancement_tooltip:0 "Попытаться избавиться от очарования"

 attempt_to_break_entrancement_confirm:0 "Свобода ждёт"

